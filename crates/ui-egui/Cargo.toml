[package]
name = "mailcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MailCraft egui front end (Outlook-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
mailcraft-time = { workspace = true }
mailcraft-i18n = { workspace = true }
mailcraft-model = { workspace = true }
mailcraft-html = { workspace = true }
mailcraft-engine = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The host a link really goes to, for its tip.
url = { workspace = true }
# Window screenshots for the control channel are saved as PNG.
image = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser clock (the std clocks panic on wasm32).
js-sys = "0.3"

[build-dependencies]
# contributors/: the credits of About, baked in by build.rs.
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
toml = "1"
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blitz-html = { version = "=0.3.0-beta.3", default-features = false }
blitz-dom = { version = "=0.3.0-beta.3", default-features = false, features = ["floats", "complex-scripts"] }
blitz-traits = { version = "=0.3.0-beta.3", default-features = false }
blitz-paint = { version = "=0.3.0-beta.3", default-features = false }
anyrender = "=0.14.0"
anyrender_vello_cpu = { version = "=0.18.0", default-features = false }
fontique = { version = "=0.12.0", default-features = false, features = ["std"] }
